services:
  collector:
    build: ./app
    image: vsaas-eventos:local
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8081:8080"
      - "${VPN_IP_ADMIN:?Falta IP de administracion}:8081:8080"
    environment:
      COLLECTOR_MAX_DATA_BYTES: "2000000000"
      COLLECTOR_ROLLOVER: "1"
      COLLECTOR_MIN_FREE_MB: "512"
    volumes:
      - collector-data:/data
    mem_limit: 384m
    memswap_limit: 384m
    cpus: "0.50"
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    stop_grace_period: 75s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
volumes:
  collector-data:
